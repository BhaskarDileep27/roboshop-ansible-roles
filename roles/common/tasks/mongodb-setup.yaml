- name: Copy mongodb repo
  ansible.builtin.copy:
    src: mongodb.repo
    dest: /etc/yum.repos.d/mongodb.repo

- name: Install mongodb client
  ansible.builtin.package:
    name: mongodb-mongosh
    state: present

- name: "get the catalogue entries count"
  ansible.builtin.shell: >
    mongosh --host {{ MONGODB_HOST }} --quiet --eval 'db = db.getSiblingDB("catalogue"); db.products.count()'
  register: products_count
  when: component == "catalogue"

- name: "get the user entries count"
  ansible.builtin.shell: >
    mongosh --host {{ MONGODB_HOST }} --quiet --eval 'db = db.getSiblingDB("users"); db.users.count()'
  register: users_count
  when: component == "user"

- name: "load catalogue data"
  ansible.builtin.shell: >
    mongosh --host {{ MONGODB_HOST }} < /app/schema/{{ component }}.js
  when: component == "catalogue" and products_count.stdout == "0"

- name: "load user data"
  ansible.builtin.shell: >
    mongosh --host {{ MONGODB_HOST }} < /app/schema/{{ component }}.js
  when: component == "user" and users_count.stdout == "0"