- name: app setup
  ansible.builtin.import_role:
    name: common
    tasks_from: app-setup

- name: node js
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs

- name: mongosh setup
  ansible.builtin.import_role:
    name: common
    tasks_from: mongosh-setup

- name: system start
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd

- name: deployment
  ansible.builtin.import_role:
    name: common
    tasks_from: deployment